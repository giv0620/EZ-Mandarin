<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EZ Mandarin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <label class="switch">
  <input type="checkbox" id="darkToggle" onchange="toggleDarkMode()">
  <span class="slider"></span>
</label>

<!-- � LANDING PAGE -->
<div id="landingPage" style="display:flex;">
  <div class="landing-container">
    <div class="landing-content">
      <h1 class="landing-title">EZ Mandarin <span class="landing-panda">🐼</span></h1>
      <p class="landing-tagline">Learning Mandarin in the Easiest Way 🏮</p>
      <button class="landing-btn" onclick="startLearning()">Start Learning →</button>
    </div>
  </div>
</div>

<!-- �🟦 HOME -->

<div id="homePage" style="display:none;">
  <h1>EZ Mandarin <span class="title-emoji">🐼✨</span></h1>
  <p class="home-subtitle">Learning Mandarin in the Easiest Way</p>

  <div class="button-group">
    <p class="section-subtitle">Choose a flashcard theme</p>
    <div class="button-container home-buttons">
      <button class="btn-pink" onclick="startFlashcard('fruits')">🍎 Fruits</button>
      <button class="btn-mint" onclick="startFlashcard('jobs')">🧑‍💼 Jobs</button>
      <button class="btn-peach" onclick="startFlashcard('foods')">🍜 Foods</button>
      <button class="btn-lavender" onclick="startFlashcard('countries')">🌍 Countries</button>
    </div>
  </div>

  <div class="button-group">
    <p class="section-subtitle">Practice your HSK levels</p>
    <div class="button-container home-buttons">
      <button class="btn-soft-blue" onclick="startFlashcard('hsk1')">HSK 1</button>
      <button class="btn-soft-blue" onclick="startFlashcard('hsk2')">HSK 2</button>
      <button class="btn-soft-blue" onclick="startFlashcard('hsk3')">HSK 3</button>
      <button class="btn-soft-blue" onclick="startFlashcard('hsk4')">HSK 4</button>
      <button class="btn-soft-blue" onclick="startFlashcard('hsk5')">HSK 5</button>
    </div>
  </div>

  <br>
  <button class="quiz-button" onclick="goToQuiz()">Ready for Quiz 🔥</button>
</div>
<img id="homePandaGif" src="./panda.gif" alt="Decorative panda" aria-hidden="true" />
<img id="lampionGif" src="./lampion.gif" alt="Decorative lampion" aria-hidden="true" />

<!-- 🟨 FLASHCARD -->

<div id="flashcardPage" style="display:none;">
  <button id="closeBtn" onclick="goHome()">×</button>
  <img id="cardImage" src="">
  <h2 id="hanzi"></h2>
  <button id="speakerBtn" onclick="speakHanzi()">🔊</button>
  <p id="pinyin"></p>
  <p id="arti"></p>

  <div class="button-container" id="flashcardButtons"></div>
</div>

<!-- 🟥 QUIZ LEVEL SELECT -->

<div id="quizPage" style="display:none;">
  <h2>WHAT’S YOUR LEVEL?</h2>

  <div class="button-container">
    <button onclick="showQuizCountdown('hsk1')">HSK 1</button>
    <button onclick="showQuizCountdown('hsk2')">HSK 2</button>
    <button onclick="showQuizCountdown('hsk3')">HSK 3</button>
    <button onclick="showQuizCountdown('hsk4')">HSK 4</button>
    <button onclick="showQuizCountdown('hsk5')">HSK 5</button>
  </div>

  <br>
  <button onclick="goHome()">Back to Home</button>
</div>

<!-- 🧠 QUIZ QUESTION -->
<div id="quizQuestionPage" style="display:none;">
  <h2 id="timerText">Time: 00:00</h2>

  <!-- 🔥 PROGRESS -->
  <h3 id="progressText"></h3>
  <div id="progressBarContainer">
    <div id="progressBar"></div>
  </div>

  <h3 id="questionText"></h3>
  <div id="options"></div>

  <div class="button-container" id="quizButtons"></div>
</div>
<!-- 🟨 CONFIRM SUBMIT -->

<div id="confirmPage" style="display:none;">
  <h2>Are you sure you want to submit?</h2>

  <div class="button-container">
    <button onclick="backToQuiz()">Check Again</button>
    <button onclick="submitQuiz()">Submit</button>
  </div>
</div>

<!-- 🟩 RESULT -->

<div id="resultPage" style="display:none;">
  <h2>Your Score</h2>
  <h1 id="scoreText"></h1>

  <div class="button-container">
    <button onclick="showReview()">See Review</button>
    <button onclick="goHome()">Back to Home</button>
  </div>
</div>

<!-- 🟪 REVIEW -->

<div id="reviewPage" style="display:none;">
  <h2>Review Answers</h2>

  <div id="reviewContainer"></div>

  <br>
  <button onclick="goHome()">Back to Home</button>
</div>

<div id="countdownOverlay" style="display:none;">
  <div class="countdown-box">
    <p>Are you ready?</p>
    <div id="countdownNumber">3</div>
  </div>
</div>

<script src="script.js"></script>

<!-- 🎉 CONFETTI LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>
</html>
